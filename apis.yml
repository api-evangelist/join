aid: join
name: Join
description: Join (Join Stories, join-stories.com) is an AI video commerce platform
  that helps e-commerce brands create, distribute, and measure short-form video across
  their sales channels. Its products include shoppable video embedded on product and
  collection pages, user-generated content (UGC) activation from social media, video
  analytics with A/B testing, an AI Studio that generates video and images from product
  data, and interactive web stories. Deployment is a single embed snippet with native
  integrations for Shopify, PrestaShop, Magento, Salesforce Commerce Cloud, WooCommerce,
  and headless storefronts. The company is backed by Canaan Partners and Seedcamp.
